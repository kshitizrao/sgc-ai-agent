[project]
name = "sgc-governance"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sgc-shared",
    "sgc-db",
    "pyyaml>=6.0",
]

[tool.uv.sources]
sgc-shared = { workspace = true }
sgc-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sgc_governance"]
