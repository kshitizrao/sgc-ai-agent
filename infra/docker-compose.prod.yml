services:
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  mcp_server:
    build:
      context: ..
      dockerfile: apps/agent-api/Dockerfile
    command: ["uv", "run", "--package", "sgc-mcp-server", "sgc-mcp-server"]
    restart: always
    ports:
      - "8001:8001"
    environment:
      - SGC_MCP_PORT=8001
      - SGC_MCP_HOST=0.0.0.0
      - SG_AI_DATABASE_URL
      - SG_AI_AGENT_DATABASE_URL

  agent-api:
    build:
      context: ..
      dockerfile: apps/agent-api/Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SG_AI_DATABASE_URL
      - SG_AI_DATABASE_URL_SYNC
      - SG_AI_AGENT_DATABASE_URL
      - SG_AI_AGENT_DATABASE_URL_SYNC
      - SG_AI_REDIS_URL=redis://redis:6379/0
      - SG_AI_OLLAMA_BASE_URL=http://ollama:11434
      - SG_AI_DEFAULT_LLM_MODEL=ollama/llama3.1:8b
      - SG_AI_MCP_SERVER_URL=http://mcp_server:8001/sse/
      - SG_AI_START_LOCAL_MCP_SERVER=false
    depends_on:
      redis:
        condition: service_healthy
      mcp_server:
        condition: service_started

  streamlit-ui:
    build:
      context: ..
      dockerfile: apps/agent-api/Dockerfile
    command: ["uv", "run", "streamlit", "run", "scripts/streamlit_chatbot.py", "--server.port", "3001", "--server.address", "0.0.0.0"]
    ports:
      - "3001:3001"
    environment:
      - API_BASE_URL=http://agent-api:8000
    depends_on:
      agent-api:
        condition: service_started

volumes:
  ollama_data:
