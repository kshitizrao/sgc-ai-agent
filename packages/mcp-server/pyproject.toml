[project]
name = "sgc-mcp-server"
version = "0.1.0"
description = "MCP Server for read-only access to prod_pikpart database tables"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "uvicorn>=0.30",
    "starlette>=0.40",
    "sse-starlette>=2.0",
    "sgc-shared",
]

[project.scripts]
sgc-mcp-server = "sgc_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sgc_mcp"]

[tool.uv.sources]
sgc-shared = { workspace = true }
