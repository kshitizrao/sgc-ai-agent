[project]
name = "sgc-db"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sgc-shared",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "pgvector>=0.3",
]

[tool.uv.sources]
sgc-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sgc_db"]

[project.scripts]
sgc-db-migrate = "sgc_db.cli:migrate"
