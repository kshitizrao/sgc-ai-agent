[project]
name = "sgc-llm-providers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sgc-shared",
    "litellm>=1.55,<1.57",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[tool.uv.sources]
sgc-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sgc_llm"]
