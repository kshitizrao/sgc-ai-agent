[project]
name = "sgc-agent-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sgc-shared",
    "sgc-db",
    "sgc-agent-core",
    "sgc-tools",
    "sgc-llm-providers",
    "sgc-governance",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "redis>=5.2",
]

[tool.uv.sources]
sgc-shared = { workspace = true }
sgc-db = { workspace = true }
sgc-agent-core = { workspace = true }
sgc-tools = { workspace = true }
sgc-llm-providers = { workspace = true }
sgc-governance = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_api"]

[project.scripts]
sgc-agent-api = "agent_api.main:run"
