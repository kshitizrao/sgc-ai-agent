[project]
name = "sgc-agent-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sgc-shared",
    "sgc-db",
    "sgc-llm-providers",
    "sgc-governance",
    "sgc-tools",
    "mcp[cli]>=1.0.0,<2.0.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
]

[tool.uv.sources]
sgc-shared = { workspace = true }
sgc-db = { workspace = true }
sgc-llm-providers = { workspace = true }
sgc-governance = { workspace = true }
sgc-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sgc_agent"]
