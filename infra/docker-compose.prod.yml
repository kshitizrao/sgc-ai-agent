services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${SG_AI_POSTGRES_USER:-sgc}
      POSTGRES_PASSWORD: ${SG_AI_POSTGRES_PASSWORD:-sgc}
      POSTGRES_DB: ${SG_AI_POSTGRES_DB:-sgc_agent}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SG_AI_POSTGRES_USER:-sgc} -d ${SG_AI_POSTGRES_DB:-sgc_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  mcp_server:
    build:
      context: ..
      dockerfile: apps/agent-api/Dockerfile
    command: ["uv", "run", "--package", "sgc-mcp-server", "sgc-mcp-server"]
    restart: always
    ports:
      - "8001:8001"
    environment:
      SGC_MCP_PORT: "8001"
      SGC_MCP_HOST: "0.0.0.0"
      SG_AI_DATABASE_URL: postgresql+asyncpg://${SG_AI_POSTGRES_USER:-sgc}:${SG_AI_POSTGRES_PASSWORD:-sgc}@postgres:5432/${SG_AI_POSTGRES_DB:-sgc_agent}
    depends_on:
      postgres:
        condition: service_healthy

  agent-api:
    build:
      context: ..
      dockerfile: apps/agent-api/Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      SG_AI_DATABASE_URL: postgresql+asyncpg://${SG_AI_POSTGRES_USER:-sgc}:${SG_AI_POSTGRES_PASSWORD:-sgc}@postgres:5432/${SG_AI_POSTGRES_DB:-sgc_agent}
      SG_AI_DATABASE_URL_SYNC: postgresql://${SG_AI_POSTGRES_USER:-sgc}:${SG_AI_POSTGRES_PASSWORD:-sgc}@postgres:5432/${SG_AI_POSTGRES_DB:-sgc_agent}
      SG_AI_REDIS_URL: redis://redis:6379/0
      SG_AI_OLLAMA_BASE_URL: http://ollama:11434
      SG_AI_DEFAULT_LLM_MODEL: ollama/llama3.1:8b
      SG_AI_MCP_SERVER_URL: http://mcp_server:8001/sse/
      SG_AI_START_LOCAL_MCP_SERVER: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp_server:
        condition: service_started

volumes:
  pgdata:
  ollama_data:
